
name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yaml'
      - 'main.py'
      - 'lambda_function.py'
      - 'schemas.py'
      - 'pyproject.toml'
      - 'uv.lock'

  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yaml'
      - 'main.py'
      - 'lambda_function.py'
      - 'schemas.py'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  terraform-pr:
    name: Validate and plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    defaults:
      run:
        working-directory: terraform/lessons/01-basics

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build Lambda package
        working-directory: .
        run: |
          mkdir -p build/lambda

          uv export \
            --locked \
            --no-dev \
            --no-emit-project \
            --format requirements-txt \
            --output-file build/requirements.txt

          uv pip install \
            --python-platform x86_64-manylinux2014 \
            --python 3.13 \
            --target build/lambda \
            -r build/requirements.txt

          cp main.py lambda_function.py schemas.py build/lambda/

          cd build/lambda
          zip -r ../carbon-mlops-lambda.zip .
      
      - name: Smoke test Lambda package
        working-directory: build/lambda
        run: |
          python -S -c "from lambda_function import lambda_handler; assert callable(lambda_handler)"
      
      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Initialize Terraform without remote backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

  terraform-main:
    name: Terraform plan (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform/lessons/01-basics

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build Lambda package
        working-directory: .
        run: |
          mkdir -p build/lambda

          uv export \
            --locked \
            --no-dev \
            --no-emit-project \
            --format requirements-txt \
            --output-file build/requirements.txt

          uv pip install \
            --python-platform x86_64-manylinux2014 \
            --python 3.13 \
            --target build/lambda \
            -r build/requirements.txt

          cp main.py lambda_function.py schemas.py build/lambda/

          cd build/lambda
          zip -r ../carbon-mlops-lambda.zip .
      
      - name: Smoke test Lambda package
        working-directory: build/lambda
        run: |
          python -S -c "from lambda_function import lambda_handler; assert callable(lambda_handler)"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate configuration
        run: terraform validate

      - name: Create execution plan
        run: terraform plan -input=false -no-color
